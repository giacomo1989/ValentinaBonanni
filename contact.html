<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Valentina Bonanni</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

<body class="contact-body" data-root=".">
  <div class="shell contact-shell">
    <header class="site-header"><a class="signature logo-signature" href="index.html"
        aria-label="Valentina Bonanni home"><img src="assets/images/logo/valentina-bonanni-signature.png"
          alt="Valentina Bonanni"></a><button class="menu-toggle" aria-label="Menu"><span></span><span></span></button>
      <nav class="nav"><a href="index.html" data-i18n="nav.home">Home</a><a href="portfolio.html"
          data-i18n="nav.portfolio">Portfolio</a><a href="about.html" data-i18n="nav.about">About</a><a
          href="contact.html" data-i18n="nav.contact">Contact</a><span class="lang"><button
            data-lang="it">IT</button><button data-lang="en">EN</button><button data-lang="es">ES</button></span></nav>
    </header>
    <main class="page contact-page">
      <section class="contact-mobile-layout">
        <!--<h2 class="script-title contact-page-title" data-i18n="contact.title">Contact</h2>-->
        <div class="contact-wrap">
          <div class="contact-copy">
            <h1 data-i18n="contact.heading">LET'S WORK TOGETHER</h1>
            <p data-i18n="contact.body"></p>
            <form class="contact-form" id="contactForm" action="https://formspree.io/f/mrpeegkw" method="POST">
              <label><span data-i18n="contact.formName">Name</span><input type="text" name="name"
                  data-i18n-placeholder="contact.formNamePlaceholder" placeholder="Your name"
                  required></label><label><span data-i18n="contact.formEmail">Email</span><input type="email"
                  name="email" data-i18n-placeholder="contact.formEmailPlaceholder" placeholder="your@email.com"
                  required></label><label><span data-i18n="contact.formProject">Project type</span><select
                  name="project_type" required>
                  <option value="" data-i18n="contact.formProjectPlaceholder">Select a project type</option>
                  <option value="Beauty" data-i18n="contact.projectBeauty">Beauty</option>
                  <option value="Runway / Fashion Show" data-i18n="contact.projectRunway">Runway / Fashion Show</option>
                  <option value="Campaign" data-i18n="contact.projectCampaign">Campaign</option>
                  <option value="Lookbook" data-i18n="contact.projectLookbook">Lookbook</option>
                  <option value="E-commerce" data-i18n="contact.projectEcommerce">E-commerce</option>
                  <option value="Event" data-i18n="contact.projectEvent">Event</option>
                  <option value="Other" data-i18n="contact.projectOther">Other</option>
                </select></label><label><span data-i18n="contact.formMessage">Message</span><textarea name="message"
                  rows="4" data-i18n-placeholder="contact.formMessagePlaceholder"
                  placeholder="Tell me about your project..." required></textarea></label><button type="submit"><span
                  data-i18n="contact.formSend">Send message</span><span aria-hidden="true">→</span></button>
              <p class="contact-form-status" id="contactFormStatus" role="status" aria-live="polite"></p>
            </form>
            <div class="contact-details">
              <div><b data-i18n="contact.email">Email</b><a href="mailto:vbonannir@gmail.com">@ vbonannir@gmail.com</a>
              </div>
              <div><b>Instagram</b><a href="https://www.instagram.com/valentinabonannir/" aria-label="Instagram"
            class="footer-instagram" target="_blank" rel="noopener noreferrer">@ valentinabonannir</a></div>
            </div>
          </div>
          <div class="contact-photo"><img data-featured="contact" alt="Valentina Bonanni"></div>
        </div>
      </section>
    </main>
    <footer class="footer footer-production">
      <div class="footer-row footer-row-main">
        <span class="footer-copyright">© 2026 VALENTINA BONANNI</span>
        <a class="footer-signature footer-logo is-ink-written" href="index.html"
          aria-label="Valentina Bonanni home"><img src="assets/images/logo/valentina-bonanni-signature.png"
            alt="Valentina Bonanni"></a>
        <span class="footer-socials"><a href="https://www.instagram.com/valentinabonannir/" aria-label="Instagram"
            class="footer-instagram" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24"
              aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4.2"></circle>
              <circle cx="17.4" cy="6.7" r="1"></circle>
            </svg></a><a href="contact.html" aria-label="Contact" class="footer-mail"><svg viewBox="0 0 24 24"
              aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="1.5"></rect>
              <path d="M4 7l8 6 8-6"></path>
            </svg></a></span>
      </div>
      <div class="footer-row footer-row-meta">
        <span class="footer-legal"><span>PRIVACY</span><span aria-hidden="true"> · </span><span>COOKIE</span></span>
        <span class="footer-powered">POWERED BY GEIVI STUDIO</span>
      </div>
    </footer>
  </div>
  <script src="js/main.js"></script>
</body>

</html>
